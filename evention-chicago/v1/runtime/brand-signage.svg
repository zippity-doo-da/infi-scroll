<svg xmlns="http://www.w3.org/2000/svg" width="5016" height="941" viewBox="0 0 5016 941">
  <defs>
    <style>
      .board { fill:#07152b; stroke:#c89b56; stroke-width:5; }
      .copy { fill:#f7f3e9; font-family:Arial,Helvetica,sans-serif; font-weight:800; text-anchor:middle; }
      .small { font-size:25px; letter-spacing:2px; }
      .large { font-size:31px; letter-spacing:2px; }
    </style>
  </defs>

  <!-- Tile 1: Evention remains the primary, architectural billboard. -->
  <g>
    <rect class="board" x="790" y="515" width="330" height="122" rx="4"/>
    <rect x="803" y="528" width="304" height="96" fill="#f7f3e9"/>
    <image href="data:image/svg+xml;base64," x="832" y="557" width="246" height="34"/>

    <rect class="board" x="1332" y="344" width="244" height="124" rx="4"/>
    <text class="copy small" x="1454" y="402">CHIPOTLE</text>
    <text class="copy" x="1454" y="432" font-size="15" letter-spacing="4">MEXICAN GRILL</text>
  </g>

  <!-- Tile 2: two distinct framed signs, never loose floating copy. -->
  <g transform="translate(1672 0)">
    <rect class="board" x="790" y="515" width="330" height="122" rx="4"/>
    <text class="copy large" x="955" y="574">TRADER JOE'S</text>
    <text class="copy" x="955" y="607" font-size="15" letter-spacing="5">NEIGHBORHOOD MARKET</text>

    <rect class="board" x="1332" y="344" width="244" height="124" rx="4"/>
    <text class="copy large" x="1454" y="417">MARRIOTT</text>
  </g>

  <!-- Tile 3: hospitality and Evention product billboard. -->
  <g transform="translate(3344 0)">
    <rect class="board" x="790" y="515" width="330" height="122" rx="4"/>
    <text class="copy" x="955" y="590" font-size="43" letter-spacing="5">HYATT</text>

    <rect class="board" x="1332" y="344" width="244" height="124" rx="4"/>
    <text class="copy" x="1454" y="396" font-size="22" letter-spacing="1">TIPS +</text>
    <text class="copy" x="1454" y="429" font-size="22" letter-spacing="1">GRATUITIES</text>
  </g>
</svg>
